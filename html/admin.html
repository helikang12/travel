<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f6f2"><title>운영 대시보드 — 느린여행</title><link rel="stylesheet" href="../css/public.css"><script type="module" src="../js/admin-dashboard.js"></script></head>
<body class="dashboard-page"><header class="dashboard-header"><a class="brand" href="../index.html"><span class="brand-mark">ㅅ</span><span>느린여행</span></a><div><span class="admin-label">운영 대시보드</span><button class="dashboard-logout" type="button" id="admin-logout">관리자 로그아웃</button></div></header><main class="dashboard-main"><div class="dashboard-title"><div><p class="eyebrow">TRAVEL ADMIN</p><h1>운영 현황</h1><p>여행지, 숙소, 예약과 회원 정보를 관리합니다.</p></div><a class="dashboard-home" href="../index.html">사이트 보기 ↗</a></div><p class="dashboard-notice" id="dashboard-notice" role="status">데이터를 불러오는 중입니다.</p><section class="dashboard-stats" id="dashboard-stats" aria-label="운영 현황 요약"></section><nav class="dashboard-tabs" aria-label="관리 메뉴"><button class="is-active" data-panel="destinations">여행지</button><button data-panel="stays">숙소</button><button data-panel="reservations">예약 확인</button><button data-panel="members">회원정보</button></nav><section class="dashboard-panel" id="panel-destinations"><div class="panel-heading"><div><p class="eyebrow">DESTINATIONS</p><h2>여행지 등록·수정</h2></div><button class="outline-button" data-new="destination">새 여행지 등록</button></div><form class="data-form" id="destination-form" hidden><input type="hidden" name="id"><div class="form-grid"><label>여행지 이름<input name="name" required></label><label>지역<input name="region" required></label><label>주소<input name="address" required></label><label>대표 이미지 URL<input name="imageUrl" type="url" required></label><label>한 줄 소개<input name="summary" required></label><label>공개 상태<select name="status"><option value="published">공개</option><option value="draft">임시저장</option><option value="hidden">숨김</option></select></label><label class="wide-field">상세 소개<textarea name="description" rows="3" required></textarea></label></div><div class="form-actions"><button class="account-submit" type="submit">저장</button><button class="outline-button" type="button" data-cancel-form>취소</button></div></form><div class="table-wrap"><table><thead><tr><th>여행지</th><th>지역</th><th>상태</th><th>수정</th></tr></thead><tbody id="destination-rows"></tbody></table></div></section><section class="dashboard-panel" id="panel-stays" hidden><div class="panel-heading"><div><p class="eyebrow">STAYS</p><h2>숙소 등록·수정</h2></div><button class="outline-button" data-new="stay">새 숙소 등록</button></div><form class="data-form" id="stay-form" hidden><input type="hidden" name="id"><div class="form-grid"><label>숙소 이름<input name="name" required></label><label>연결 여행지<select name="destinationId" id="stay-destination" required></select></label><label>주소<input name="address" required></label><label>문의 전화번호<input name="phone" type="tel" required></label><label>1박 기준 가격<input name="pricePerNight" type="number" min="0" required></label><label>최대 인원<input name="maxGuests" type="number" min="1" required></label><label>대표 이미지 URL<input name="imageUrl" type="url" required></label><label>운영 상태<select name="status"><option value="active">활성</option><option value="inactive">비활성</option></select></label><label class="wide-field">숙소 소개<textarea name="description" rows="3" required></textarea></label></div><div class="form-actions"><button class="account-submit" type="submit">저장</button><button class="outline-button" type="button" data-cancel-form>취소</button></div></form><div class="table-wrap"><table><thead><tr><th>숙소</th><th>연결 여행지</th><th>1박 가격</th><th>상태</th><th>수정</th></tr></thead><tbody id="stay-rows"></tbody></table></div></section><section class="dashboard-panel" id="panel-reservations" hidden><div class="panel-heading"><div><p class="eyebrow">RESERVATIONS</p><h2>예약 확인 및 상태 관리</h2></div></div><div class="table-wrap"><table><thead><tr><th>예약번호</th><th>회원</th><th>숙소</th><th>숙박일</th><th>인원·금액</th><th>상태</th><th>처리</th></tr></thead><tbody id="reservation-rows"></tbody></table></div></section><section class="dashboard-panel" id="panel-members" hidden><div class="panel-heading"><div><p class="eyebrow">MEMBERS</p><h2>회원 정보</h2></div><input class="table-search" id="member-search" type="search" placeholder="이름 또는 이메일 검색" aria-label="회원 검색"></div><div class="table-wrap"><table><thead><tr><th>이름</th><th>이메일</th><th>연락처</th><th>상태</th><th>가입일</th></tr></thead><tbody id="member-rows"></tbody></table></div></section></main></body></html>
