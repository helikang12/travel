<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f6f2"><title>회원가입 — 느린여행</title><link rel="stylesheet" href="../css/public.css"><script type="module" src="../js/auth-pages.js"></script></head>
<body class="account-page"><header class="account-header"><a class="brand" href="../index.html"><span class="brand-mark">ㅅ</span><span>느린여행</span></a></header><main class="account-main"><a class="account-back" href="../index.html">← 메인으로</a><p class="eyebrow">JOIN THE JOURNEY</p><h1>회원가입</h1><p class="account-lead">느린여행과 함께 나다운 여행을 찾아보세요.</p><form class="account-form" id="signup-form"><label>이름<input name="name" autocomplete="name" required maxlength="40"></label><label>이메일<input name="email" type="email" autocomplete="email" required></label><label>연락처<input name="phone" type="tel" autocomplete="tel" required></label><label>비밀번호<input name="password" type="password" autocomplete="new-password" minlength="6" required><small>비밀번호는 6자 이상 입력해 주세요.</small></label><button class="account-submit" type="submit">회원가입</button><p class="form-status" aria-live="polite"></p></form><p class="account-switch">이미 계정이 있나요? <a href="login.html">로그인</a></p></main></body></html>
